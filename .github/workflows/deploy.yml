name: Test and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: jannie/go.mod
          cache-dependency-path: jannie/go.sum

      - name: Test the Yasat site under /new (jannie/)
        working-directory: jannie
        run: |
          go vet ./...
          go test -short ./...
          node --test games/yasat/test/*.test.mjs
          scripts/build-site "$RUNNER_TEMP/new"

  build:
    name: Build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get build date
        id: build_date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Build
        run: yarn build
        env:
          CI: false
          REACT_APP_BUILD_VERSION: ${{ github.sha }}
          REACT_APP_BUILD_DATE: ${{ steps.build_date.outputs.BUILD_DATE }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: jannie/go.mod
          cache-dependency-path: jannie/go.sum

      - name: Build the Yasat site under /new (jannie/)
        run: jannie/scripts/build-site "$PWD/build/new"
        env:
          VERSION: ${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
